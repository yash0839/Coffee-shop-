<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Brew & Bean</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>

<body class="auth-page">
    <div class="container py-5">
        <div class="auth-card mx-auto"><a class="brand-link" href="index.html"><i class="bi bi-cup-hot-fill"></i> Brew &
                Bean</a>
            <h2>Create Account</h2>
            <p>Join our coffee community.</p>
            <form class="needs-validation" novalidate><label class="form-label">Full Name</label><input
                    class="form-control mb-3" required><label class="form-label">Email</label><input type="email"
                    class="form-control mb-3" required><label class="form-label">Phone</label><input type="tel"
                    class="form-control mb-3" required><label class="form-label">Password</label><input type="password"
                    class="form-control mb-3" minlength="6" required><label class="form-label">Confirm
                    Password</label><input type="password" class="form-control mb-3" required>
                <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms" required><label
                        class="form-check-label" for="terms">I agree to the terms and conditions.</label></div><button
                    class="btn btn-coffee w-100">Register</button>
            </form>
            <p class="mt-4 text-center">Already have an account? <a href="login.html">Login</a></p>
            <p class="text-center"><a href="index.html">← Back to Home</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/javascript/register.js"></script>

</body>

</html>
