<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/index.css">    
</head>
<body>
    
<!-- ================= BOOKING SECTION ================= -->

<section class="section-padding">

    <div class="container text-center">

        <i class="bi bi-calendar-check display-5"></i>

        <h2 class="mt-3">
            Reserve Your Table
        </h2>

        <p class="text-muted">
            Click the button below to book your table.
        </p>

        <!-- BOOK TABLE BUTTON -->
        <button 
            type="button"
            class="btn btn-coffee px-5 py-2"
            data-bs-toggle="modal"
            data-bs-target="#bookingModal">

            <i class="bi bi-calendar-check"></i>
            Book a Table

        </button>

    </div>

</section>


<!-- ================= BOOKING MODAL ================= -->

<div 
    class="modal fade"
    id="bookingModal"
    tabindex="-1"
    aria-labelledby="bookingModalLabel"
    aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <!-- MODAL HEADER -->
            <div class="modal-header">

                <h5 class="modal-title" id="bookingModalLabel">

                    <i class="bi bi-calendar-check"></i>
                    Reserve Your Table

                </h5>

                <button 
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <!-- MODAL BODY -->
            <div class="modal-body">

                <form id="bookingForm">

                    <!-- NAME -->
                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input 
                            type="text"
                            class="form-control"
                            id="name"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <!-- EMAIL -->
                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input 
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- PHONE -->
                    <div class="mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input 
                            type="tel"
                            class="form-control"
                            id="phone"
                            placeholder="Enter phone number"
                            maxlength="10"
                            required>

                    </div>


                    <!-- DATE -->
                    <div class="mb-3">

                        <label class="form-label">
                            Booking Date
                        </label>

                        <input 
                            type="date"
                            class="form-control"
                            id="bookingDate"
                            required>

                    </div>


                    <!-- PEOPLE -->
                    <div class="mb-3">

                        <label class="form-label">
                            Number of People
                        </label>

                        <select 
                            class="form-select"
                            id="people"
                            required>

                            <option value="">
                                Select number of people
                            </option>

                            <option value="1">1 Person</option>
                            <option value="2">2 People</option>
                            <option value="3">3 People</option>
                            <option value="4">4 People</option>
                            <option value="5">5 People</option>
                            <option value="6">6 People</option>

                        </select>

                    </div>


                    <!-- TIME SLOT -->
                    <div class="mb-3">

                        <label class="form-label">
                            Select Time Slot
                        </label>

                        <select 
                            class="form-select"
                            id="timeSlot"
                            required>

                            <option value="">
                                Select a time slot
                            </option>

                            <option value="10:00 AM">10:00 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="12:00 PM">12:00 PM</option>
                            <option value="01:00 PM">01:00 PM</option>
                            <option value="02:00 PM">02:00 PM</option>
                            <option value="05:00 PM">05:00 PM</option>
                            <option value="06:00 PM">06:00 PM</option>
                            <option value="07:00 PM">07:00 PM</option>
                            <option value="08:00 PM">08:00 PM</option>
                            <option value="09:00 PM">09:00 PM</option>

                        </select>

                    </div>


                    <!-- SPECIAL REQUEST -->
                    <div class="mb-4">

                        <label class="form-label">
                            Special Request
                        </label>

                        <textarea 
                            class="form-control"
                            id="message"
                            rows="3"
                            placeholder="Birthday, window seat, etc.">
                        </textarea>

                    </div>


                    <!-- SUBMIT BUTTON -->
                    <button 
                        type="submit"
                        class="btn btn-coffee w-100">

                        <i class="bi bi-calendar-check"></i>
                        Book My Table

                    </button>

                </form>


                <!-- SUCCESS MESSAGE -->
                <div 
                    id="successMessage"
                    class="alert alert-success mt-4 d-none">

                    <i class="bi bi-check-circle-fill"></i>

                    <strong>
                        Booking Successful!
                    </strong>

                    <p class="mb-0">
                        Your table has been reserved successfully.
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>


</div>
<script>
const bookingForm = document.getElementById("bookingForm");
const successMessage = document.getElementById("successMessage");

bookingForm.addEventListener("submit", function (event) {

    event.preventDefault();

    successMessage.classList.remove("d-none");

    bookingForm.reset();

});
</script>
</body>
</html>
