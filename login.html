<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Brew & Bean</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>

<body class="auth-page">
    <div class="container py-5">
        <div class="auth-card mx-auto"><a class="brand-link" href="index.html"><i class="bi bi-cup-hot-fill"></i> Brew &
                Bean</a>
            <h2>Welcome Back</h2>
            <p>Login to continue.</p>
            <form class="needs-validation" novalidate>

                <label class="form-label">Email</label>
                <input type="email" class="form-control mb-3" id="email" required>

                <div class="position-relative mb-3">
                    <label class="form-label">Password</label>

                    <input type="password" id="password" class="form-control" required>

                    <button type="button" class="btn position-absolute end-0" style="bottom: 0;" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>

                <button type="submit" class="btn btn-coffee w-100">
                    Login
                </button>

            </form>
            <p class="mt-4 text-center">Don't have an account? <a href="register.html">Register</a></p>
            <p class="text-center"><a href="index.html">← Back to Home</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./javascript/login.js"></script>
</body>

</html>
